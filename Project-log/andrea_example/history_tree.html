<!doctype html>
<!--
  Interactive tree of the history of a project (project_log). Generic page: all the content is in history_data.js.
  - Central branch: accepted steps; side branches: discarded / superseded attempts; click a branch for its details.
  - Every node refers to the section of HISTORY.md with the same id.
  - The project leader (DATA.leader) is the only one who marks a step as accepted; running branches show who is running them.
  - Open it directly in a browser (file:// works). Do not edit this file to add steps: edit history_data.js.
  See README.md in this folder for the conventions of the whole folder.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work tree</title>
<style>
:root {
  --bg: #f7f6f2; --surface: #ffffff; --ink: #1f2328; --ink-2: #57606a; --line: #d0d7de;
  --acc: #1a7f37; --acc-bg: #dafbe1; --dis: #b42318; --dis-bg: #fde8e7;
  --sup: #9a6700; --sup-bg: #fff4d4; --pen: #0969da; --pen-bg: #ddf4ff; --run: #8250df; --run-bg: #fbefff; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #161b22; --ink: #e6edf3; --ink-2: #9198a1; --line: #30363d;
    --acc: #3fb950; --acc-bg: #12261a; --dis: #f47067; --dis-bg: #2d1414; --sup: #d29922; --sup-bg: #2b2111;
    --pen: #58a6ff; --pen-bg: #0c2340; --run: #bc8cff; --run-bg: #271a3d; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b22; --ink: #e6edf3; --ink-2: #9198a1; --line: #30363d;
  --acc: #3fb950; --acc-bg: #12261a; --dis: #f47067; --dis-bg: #2d1414; --sup: #d29922; --sup-bg: #2b2111;
  --pen: #58a6ff; --pen-bg: #0c2340; --run: #bc8cff; --run-bg: #271a3d; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { max-width: 1100px; margin: 0 auto; padding: 24px 16px 8px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--ink-2); margin: 0 0 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.legend button[aria-pressed="false"] { opacity: .45; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }
.row { display: grid; grid-template-columns: 1fr 280px 1fr; align-items: center; position: relative; padding: 14px 0; }
.row::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--acc); opacity: .5; }
.row:first-child::before { top: 50%; }
.row:last-child::before { bottom: 50%; background: repeating-linear-gradient(var(--pen) 0 6px, transparent 6px 12px); }
.side { display: flex; flex-direction: column; gap: 10px; position: relative; }
.side.left { align-items: flex-end; padding-right: 36px; }
.side.right { align-items: flex-start; padding-left: 36px; }
.side.left .node::after, .side.right .node::after { content: ""; position: absolute; top: 50%; width: 36px; border-top: 2px dashed var(--line); }
.side.left .node::after { right: -38px; }
.side.right .node::after { left: -38px; }
.node { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c);
  border-radius: 8px; padding: 8px 12px; cursor: pointer; box-shadow: var(--shadow); text-align: left; font: inherit; color: inherit;
  width: 100%; max-width: 300px; }
.node:hover, .node:focus-visible { outline: 2px solid var(--c); outline-offset: 1px; }
.trunk .node { max-width: none; border-left-width: 6px; }
.node .meta { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.node .t { font-weight: 600; font-size: 14px; margin-top: 2px; }
.node .badge { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--cb); color: var(--c); font-weight: 600; }
.node .who { font-size: 12px; color: var(--run); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.node .who::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .node .who::before { animation: none; } }
.leader { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.hidden { display: none !important; }
.only-run .node:not([data-s="run"]) { opacity: .25; }
.legend .only { border-style: dashed; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; max-width: 720px; width: calc(100% - 32px);
  background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg-head { padding: 16px 20px 8px; border-bottom: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: 12px 12px 0 0; }
.dlg-head h2 { margin: 4px 0 0; font-size: 19px; }
.dlg-body { padding: 12px 20px; max-height: 65vh; overflow-y: auto; }
.dlg-body table { border-collapse: collapse; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
.dlg-body th, .dlg-body td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; white-space: nowrap; }
.dlg-body code { font-size: 13px; background: var(--bg); padding: 0 4px; border-radius: 4px; }
.dlg-foot { padding: 10px 20px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.dlg-foot button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 4px 14px; cursor: pointer; }
.theme { float: right; }
@media (max-width: 760px) {
  .row { grid-template-columns: 1fr; gap: 8px; padding: 10px 0 10px 18px; }
  .row::before { left: 6px; margin-left: 0; }
  .trunk { order: 0; } .side.left { order: 1; } .side.right { order: 2; }
  .side.left, .side.right { align-items: stretch; padding: 0 0 0 20px; }
  .side.left .node::after, .side.right .node::after { left: -20px; right: auto; width: 18px; }
  .node { max-width: none; }
}
</style>
</head>
<body>
<header>
  <button class="theme legend" id="theme" style="all:unset;cursor:pointer;float:right;font-size:13px;color:var(--ink-2)">tema ◐</button>
  <h1 id="page-title"></h1>
  <p class="leader" id="leader"></p>
  <p class="sub">Al centro le scelte accettate, ai lati quelle scartate o superate. Clic su un ramo per i dettagli; ogni ramo rimanda alla sezione di <code>HISTORY.md</code>.</p>
  <div class="legend" id="legend"></div>
</header>
<main id="tree"></main>

<dialog id="dlg">
  <div class="dlg-head" id="dlg-head"><div class="meta" id="dlg-meta"></div><h2 id="dlg-title"></h2></div>
  <div class="dlg-body" id="dlg-body"></div>
  <div class="dlg-foot"><span id="dlg-ref"></span><button id="dlg-close">Chiudi</button></div>
</dialog>

<script src="history_data.js"></script>
<script>
const STATUS = {
  acc: { label: 'accettato', c: '--acc', cb: '--acc-bg' },
  dis: { label: 'scartato',  c: '--dis', cb: '--dis-bg' },
  sup: { label: 'superato',  c: '--sup', cb: '--sup-bg' },
  run: { label: 'in corso',  c: '--run', cb: '--run-bg' },
  pen: { label: 'in attesa', c: '--pen', cb: '--pen-bg' },
};

const DATA = window.HISTORY_DATA, ROWS = DATA.rows;
document.getElementById('page-title').textContent = DATA.title;
if (DATA.leader) document.getElementById('leader').textContent = `Leader del progetto: ${DATA.leader} (è chi segna i passi come accettati)`;

const nodes = {};
const tree = document.getElementById('tree');
function card(n, cls) {
  nodes[n.id] = n;
  const st = STATUS[n.s];
  const b = document.createElement('button');
  b.className = 'node ' + cls; b.dataset.s = n.s; b.dataset.id = n.id;
  b.style.setProperty('--c', `var(${st.c})`); b.style.setProperty('--cb', `var(${st.cb})`);
  b.innerHTML = `<div class="meta"><span>${n.id} · ${n.date}</span><span class="badge">${st.label}</span></div><div class="t">${n.t}</div>` +
    (n.s === 'run' && n.who ? `<div class="who">${n.who}</div>` : '');
  b.addEventListener('click', () => open(n.id));
  return b;
}
for (const r of ROWS) {
  const row = document.createElement('div'); row.className = 'row';
  const L = document.createElement('div'); L.className = 'side left';
  const C = document.createElement('div'); C.className = 'trunk';
  const R = document.createElement('div'); R.className = 'side right';
  (r.left || []).forEach(n => L.appendChild(card(n, '')));
  C.appendChild(card(r.trunk, ''));
  (r.right || []).forEach(n => R.appendChild(card(n, '')));
  row.append(L, C, R); tree.appendChild(row);
}

const dlg = document.getElementById('dlg');
function open(id) {
  const n = nodes[id], st = STATUS[n.s];
  document.getElementById('dlg-head').style.setProperty('--c', `var(${st.c})`);
  const by = n.s === 'acc' && DATA.leader ? ` da ${DATA.leader}` : n.s === 'run' && n.who ? ` · ${n.who}` : '';
  document.getElementById('dlg-meta').textContent = `${n.id} · ${n.date}/${DATA.year} · ${st.label}${by}`;
  document.getElementById('dlg-title').textContent = n.t;
  document.getElementById('dlg-body').innerHTML = n.d;
  document.getElementById('dlg-ref').innerHTML = `Dettagli: <a href="HISTORY.md">HISTORY.md</a> § ${n.id}`;
  dlg.showModal();
}
document.getElementById('dlg-close').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

// legend = status filter
const shown = Object.fromEntries(Object.keys(STATUS).map(k => [k, true]));
const legend = document.getElementById('legend');
for (const [k, st] of Object.entries(STATUS)) {
  const b = document.createElement('button'); b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<span class="dot" style="background:var(${st.c})"></span>${st.label}`;
  b.onclick = () => {
    shown[k] = !shown[k]; b.setAttribute('aria-pressed', String(shown[k]));
    document.querySelectorAll('.side .node').forEach(el => el.classList.toggle('hidden', !shown[el.dataset.s]));
  };
  legend.appendChild(b);
}
// highlight only the running branches (who is doing what)
const only = document.createElement('button'); only.className = 'only'; only.setAttribute('aria-pressed', 'false');
only.innerHTML = `<span class="dot" style="background:var(--run)"></span>solo in corso`;
only.onclick = () => {
  const on = only.getAttribute('aria-pressed') !== 'true';
  only.setAttribute('aria-pressed', String(on)); tree.classList.toggle('only-run', on);
};
legend.appendChild(only);

// theme toggle
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
};
</script>
</body>
</html>
